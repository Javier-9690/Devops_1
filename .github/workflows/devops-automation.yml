name: Validación DevOps
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuración y construir
        run: |
          docker compose config -q
          docker compose up -d --build
      - name: Verificar HTTP y archivos estáticos
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8080/ -o /tmp/index.html
          grep -q 'Reserva tu hora médica' /tmp/index.html
          curl --fail http://localhost:8080/styles.css -o /dev/null
      - name: Diagnóstico y limpieza
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color
          docker compose down
